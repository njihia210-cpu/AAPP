<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arbeit – Alena</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a22">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alena">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="/theme.js"></script>
<style>
  .kennzahlen { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0.7rem; margin-bottom: 1.4rem; }
  .zeile { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  .zeile input[type="search"] { flex: 1; min-width: 180px; }

  /* --------------------------------------------------------- Branchenwahl */
  .branchen { display: grid; gap: 0.7rem; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .branche {
    display: grid; gap: 0.3rem; text-align: left; font: inherit; color: var(--text); cursor: pointer;
    padding: 1.1rem 1.2rem; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--line); transition: border-color 0.16s ease;
  }
  .branche:hover { border-color: var(--akzent-1); }
  .branche .icon { width: 38px; height: 38px; margin: 0 0 0.4rem; font-size: 1.1rem; }
  .branche b { font-size: 1rem; font-weight: 600; }
  .branche span { font-size: 0.82rem; color: var(--text-dim); }
  .branche .vorlage { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.4rem; }

  /* --------------------------------------------------------------- Boards */
  .boardleiste { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .boardknopf {
    padding: 0.5rem 0.95rem; border-radius: 999px; font: inherit; font-size: 0.88rem; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); color: var(--text-soft);
  }
  .boardknopf[aria-pressed="true"] { border-color: var(--akzent-1); background: var(--surface-strong); color: var(--text); }
  .boardknopf .zahl { color: var(--text-dim); margin-left: 0.35rem; font-size: 0.8rem; }

  .spalten { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); align-items: start; }
  .spalte {
    border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); padding: 0.8rem;
  }
  .spaltenkopf { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.7rem; }
  .spaltenkopf b { font-size: 0.85rem; font-weight: 600; }
  .spaltenkopf .zahl { margin-left: auto; font-size: 0.78rem; color: var(--text-dim); }
  .punkt { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .f-blau { background: #5b8def; } .f-gruen { background: #34c17f; } .f-gelb { background: #e8a13a; }
  .f-rot { background: #e25a5a; } .f-violett { background: #9b7bf0; } .f-grau { background: #8b8ba0; }

  .kunde {
    display: grid; gap: 0.3rem; width: 100%; text-align: left; font: inherit; color: var(--text);
    cursor: pointer; padding: 0.7rem 0.85rem; border-radius: 11px; margin-bottom: 0.5rem;
    background: var(--input-bg); border: 1px solid var(--line);
  }
  .kunde:hover { border-color: var(--line-strong); }
  .kunde:last-child { margin-bottom: 0; }
  .kunde b { font-size: 0.92rem; font-weight: 600; }
  .kunde .unter { font-size: 0.78rem; color: var(--text-dim); }
  .kunde .marken { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.2rem; }
  .mark {
    font-size: 0.7rem; padding: 0.12rem 0.45rem; border-radius: 999px;
    border: 1px solid var(--line); color: var(--text-dim);
  }
  .mark.warn { color: #e8a13a; border-color: rgba(232, 161, 58, 0.45); }
  .spalte .leer { padding: 0.9rem 0; text-align: center; font-size: 0.8rem; color: var(--text-dim); }

  /* -------------------------------------------------------------- Detail */
  .ruecken { position: fixed; inset: 0; z-index: 60; background: rgba(6, 4, 20, 0.72); backdrop-filter: blur(4px); }
  .schub {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 61; width: min(520px, 100%);
    background: var(--bg); border-left: 1px solid var(--line); overflow-y: auto;
    padding: clamp(1.2rem, 4vw, 2rem); padding-top: max(1.2rem, env(safe-area-inset-top));
  }
  .schub h3 { margin: 0 0 0.2rem; font-size: 1.25rem; letter-spacing: -0.02em; }
  .schub .abschnitt { margin-top: 1.6rem; }
  .schub .abschnitt h4 { margin: 0 0 0.7rem; font-size: 0.92rem; font-weight: 600; }

  .statuswahl { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .statuschip {
    display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.75rem; border-radius: 999px;
    font: inherit; font-size: 0.82rem; cursor: pointer; background: var(--input-bg);
    border: 1px solid var(--line); color: var(--text-soft);
  }
  .statuschip[aria-pressed="true"] { border-color: var(--akzent-1); background: var(--surface-strong); color: var(--text); }

  .verlauf { display: grid; gap: 0.5rem; }
  .eintrag {
    padding: 0.7rem 0.9rem; border-radius: 11px; background: var(--surface); border: 1px solid var(--line);
  }
  .eintrag .oben { display: flex; justify-content: space-between; gap: 0.8rem; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 0.25rem; }
  .eintrag p { margin: 0; font-size: 0.9rem; }

  .aufgabe { display: flex; gap: 0.6rem; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--line-soft); }
  .aufgabe:last-child { border-bottom: none; }
  .aufgabe input[type="checkbox"] { width: 19px; height: 19px; flex: none; accent-color: var(--accent); }
  .aufgabe .txt { flex: 1; font-size: 0.9rem; }
  .aufgabe.fertig .txt { text-decoration: line-through; color: var(--text-dim); }
  .aufgabe .frist { font-size: 0.75rem; color: var(--text-dim); }
  .aufgabe .frist.spaet { color: #e25a5a; }

  .weg {
    width: 32px; height: 32px; border-radius: 9px; cursor: pointer; font: inherit; flex: none;
    border: 1px solid var(--line); background: var(--input-bg); color: var(--text-dim);
  }
  .weg:hover { color: #e25a5a; border-color: rgba(226, 90, 90, 0.5); }

  .verwaltung { display: grid; gap: 0.5rem; }
  .verwaltzeile { display: grid; grid-template-columns: 1fr 120px auto; gap: 0.5rem; align-items: center; }
  @media (max-width: 520px) { .verwaltzeile { grid-template-columns: 1fr auto; } .verwaltzeile select { grid-column: 1; } }
  .leer { padding: 2.4rem 1rem; text-align: center; color: var(--text-dim); font-size: 0.92rem; }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/app"><img src="/icons/logo.png" alt="" width="38" height="38"><span>Alena</span></a>
    <div style="display:flex;align-items:center;gap:0.7rem">
      <span class="tiny" id="saveState"></span>
      <a class="btn btn-quiet btn-sm" href="/einstellungen">Einstellungen</a>
      <a class="btn btn-quiet btn-sm" href="/app">Zurück</a>
    </div>
  </div>
</header>

<main class="wrap" style="padding-block:2rem 3rem">
  <div class="section-head" style="margin-bottom:1.4rem">
    <div class="eyebrow" id="eyebrow">Arbeit</div>
    <h2 id="titel">Dein Arbeitsbereich</h2>
    <p id="untertitel">Wähle deine Branche – Alena richtet das passende Board ein.</p>
  </div>

  <div class="msg" id="msg" role="status"></div>

  <!-- ============================================== Branchenwahl ======= -->
  <section id="einrichten" hidden style="padding:0">
    <div class="branchen" id="branchen"></div>
    <p class="tiny" style="margin-top:1.2rem">
      Die Wahl bleibt in deinem Login gespeichert. Boards und Status kannst du danach
      jederzeit umbenennen, ergänzen oder löschen.
    </p>
  </section>

  <!-- =================================================== Board ======== -->
  <section id="board" hidden style="padding:0">
    <div class="kennzahlen" id="kennzahlen"></div>

    <div class="zeile" style="margin-bottom:1.2rem">
      <input type="search" id="suche" placeholder="Suchen – Name, Firma, Notiz oder Update" autocomplete="off">
      <button class="btn btn-primary" id="neuBtn">Neu</button>
      <button class="btn btn-quiet" id="verwaltenBtn">Boards und Status</button>
    </div>

    <div class="boardleiste" id="boardleiste"></div>
    <div class="spalten" id="spalten"></div>

    <div class="abschnitt" style="margin-top:2rem">
      <h3 style="margin:0 0 0.8rem;font-size:1rem">Zuletzt passiert</h3>
      <div class="verlauf" id="verlauf"></div>
    </div>
  </section>
</main>

<!-- ==================================================== Detail ======== -->
<div class="ruecken" id="ruecken" hidden></div>
<aside class="schub" id="schub" hidden aria-label="Details"></aside>

<footer>
  <div class="wrap" style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap">
    <span class="tiny">Alena · Arbeit</span>
    <a class="tiny" href="/app">← Alle Apps</a>
  </div>
</footer>

<script src="/ambient.js" defer></script>
<script type="module">
import * as A from '/arbeit-core.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const api = async (url, options = {}) => {
  const res = await fetch(url, {
    headers: { 'content-type': 'application/json' }, credentials: 'include',
    ...options, body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(out.error || 'Fehler');
  return out;
};
const flash = (t, kind = 'ok') => {
  const el = $('msg'); el.textContent = t; el.className = `msg ${kind} show`;
  setTimeout(() => el.classList.remove('show'), 6000);
};

let daten = A.leereArbeit();
let aktivesBoard = null;
/* Was steht gerade im Seitenpanel? { art: 'kunde' | 'verwaltung', id } */
let schub = null;
let speichernTimer = null;
const HEUTE = A.heuteISO();
const kennung = () => Math.random().toString(16).slice(2, 10);
const wort = () => A.wortschatz(daten);

function speichern() {
  clearTimeout(speichernTimer);
  $('saveState').textContent = 'Speichert …';
  speichernTimer = setTimeout(async () => {
    try {
      const out = await api('/api/data?app=arbeit', { method: 'PUT', body: { data: daten } });
      daten = out.data;
      $('saveState').textContent = 'Gespeichert';
      setTimeout(() => { $('saveState').textContent = ''; }, 1800);
      zeichne();
    } catch (err) {
      $('saveState').textContent = '';
      flash(err.message, 'error');
    }
  }, 500);
}

/* =========================================================== Einrichten */
function zeichneBranchen() {
  $('einrichten').hidden = false;
  $('board').hidden = true;
  const box = $('branchen');
  box.innerHTML = '';
  for (const b of A.BRANCHEN) {
    const el = document.createElement('button');
    el.className = 'branche'; el.type = 'button'; el.dataset.branche = b.id;
    el.innerHTML = `
      <span class="icon">${b.icon}</span>
      <b>${esc(b.name)}</b>
      <span>${esc(b.beschreibung)}</span>
      <span class="vorlage">Boards: ${esc(b.boards.join(' · '))}</span>`;
    el.addEventListener('click', () => {
      daten = A.richteEin(b.id);
      aktivesBoard = daten.boards[0]?.id || null;
      speichern();
      zeichne();
      flash(`${b.name} eingerichtet. Boards und Status kannst du jederzeit anpassen.`);
    });
    box.appendChild(el);
  }
}

/* ================================================================ Board */
function zeichneKopf() {
  const b = A.findeBranche(daten.branche);
  $('eyebrow').textContent = `Arbeit · ${b.name}`;
  $('titel').textContent = `Deine ${wort().mehrzahl}`;
  $('untertitel').textContent =
    'Auf Boards abgelegt, nach deinen Status sortiert – mit Verlauf und Aufgaben je Eintrag.';
}

function zeichneKennzahlen() {
  const z = A.zahlen(daten, HEUTE);
  $('kennzahlen').innerHTML = `
    <div class="stat"><b>${z.kunden}</b><span>${esc(wort().mehrzahl)}</span></div>
    <div class="stat"><b>${z.offeneTodos}</b><span>offene Aufgaben</span></div>
    <div class="stat"><b>${z.ueberfaellig}</b><span>überfällig</span></div>
    <div class="stat"><b>${z.ohneUpdate}</b><span>ohne Update</span></div>`;
}

function zeichneBoardleiste() {
  const box = $('boardleiste');
  box.innerHTML = '';
  for (const b of A.sortiertNachOrdnung(daten.boards)) {
    const n = daten.kunden.filter((k) => k.board === b.id).length;
    const el = document.createElement('button');
    el.className = 'boardknopf'; el.type = 'button'; el.dataset.board = b.id;
    el.setAttribute('aria-pressed', String(aktivesBoard === b.id));
    el.innerHTML = `${esc(b.name)}<span class="zahl">${n}</span>`;
    el.addEventListener('click', () => { aktivesBoard = b.id; zeichne(); });
    box.appendChild(el);
  }
}

function kundenKarte(k) {
  const el = document.createElement('button');
  el.className = 'kunde'; el.type = 'button'; el.dataset.kunde = k.id;
  const letzte = A.letztesUpdate(k);
  const offen = A.offeneTodos(k);
  const spaet = (k.todos || []).filter((t) => A.istUeberfaellig(t, HEUTE)).length;
  el.innerHTML = `
    <b>${esc(k.name)}</b>
    ${k.firma ? `<span class="unter">${esc(k.firma)}</span>` : ''}
    ${letzte ? `<span class="unter">${esc(letzte.datum)}: ${esc(letzte.text.slice(0, 70))}${letzte.text.length > 70 ? '…' : ''}</span>` : '<span class="unter">noch kein Update</span>'}
    <span class="marken">
      ${offen ? `<span class="mark">${offen} Aufgabe${offen === 1 ? '' : 'n'}</span>` : ''}
      ${spaet ? `<span class="mark warn">${spaet} überfällig</span>` : ''}
    </span>`;
  el.addEventListener('click', () => oeffneKunde(k.id));
  return el;
}

function zeichneSpalten() {
  const box = $('spalten');
  box.innerHTML = '';
  if (!aktivesBoard) { box.innerHTML = '<div class="leer">Kein Board vorhanden.</div>'; return; }

  const suche = $('suche').value;
  for (const sp of A.spalten(daten, aktivesBoard)) {
    const treffer = sp.kunden.filter((k) => A.passt(k, suche));
    const el = document.createElement('div');
    el.className = 'spalte';
    el.innerHTML = `
      <div class="spaltenkopf">
        <span class="punkt f-${esc(sp.status.farbe || 'grau')}"></span>
        <b>${esc(sp.status.name)}</b>
        <span class="zahl">${treffer.length}</span>
      </div>`;
    if (!treffer.length) {
      el.insertAdjacentHTML('beforeend', '<div class="leer">–</div>');
    } else {
      treffer.forEach((k) => el.appendChild(kundenKarte(k)));
    }
    box.appendChild(el);
  }
}

function zeichneVerlauf() {
  const box = $('verlauf');
  const liste = A.verlauf(daten, 8);
  box.innerHTML = liste.length
    ? liste.map((u) => `
        <div class="eintrag">
          <div class="oben"><span>${esc(u.kunde)}</span><span>${esc(u.datum)}</span></div>
          <p>${esc(u.text)}</p>
        </div>`).join('')
    : '<p class="tiny" style="margin:0">Noch keine Updates erfasst.</p>';
}

function zeichne() {
  if (!A.istEingerichtet(daten)) return zeichneBranchen();
  $('einrichten').hidden = true;
  $('board').hidden = false;
  if (!aktivesBoard || !daten.boards.some((b) => b.id === aktivesBoard)) {
    aktivesBoard = A.sortiertNachOrdnung(daten.boards)[0]?.id || null;
  }
  zeichneKopf(); zeichneKennzahlen(); zeichneBoardleiste(); zeichneSpalten(); zeichneVerlauf();
  // Das Panel neu zeichnen, ohne es dabei zu schliessen.
  if (schub?.art === 'kunde') zeichneSchub();
  else if (schub?.art === 'verwaltung') zeichneVerwaltung();
}

/* ============================================================== Detail */
function schliesse() {
  schub = null;
  $('schub').hidden = true;
  $('ruecken').hidden = true;
  document.body.style.overflow = '';
}
$('ruecken').addEventListener('click', schliesse);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && schub) schliesse(); });

function oeffnePanel(art, id = null) {
  schub = { art, id };
  $('schub').hidden = false;
  $('ruecken').hidden = false;
  document.body.style.overflow = 'hidden';
  if (art === 'kunde') zeichneSchub(); else zeichneVerwaltung();
}

const oeffneKunde = (id) => oeffnePanel('kunde', id);

function zeichneSchub() {
  const k = daten.kunden.find((x) => x.id === schub?.id);
  if (!k) return schliesse();
  const box = $('schub');
  const status = A.sortiertNachOrdnung(daten.status);
  const boards = A.sortiertNachOrdnung(daten.boards);

  box.innerHTML = `
    <div class="zeile" style="justify-content:space-between;align-items:flex-start">
      <div>
        <h3>${esc(k.name)}</h3>
        ${k.firma ? `<p class="tiny" style="margin:0">${esc(k.firma)}</p>` : ''}
      </div>
      <button class="btn btn-quiet btn-sm" data-tun="zu">Schliessen</button>
    </div>

    <div class="abschnitt">
      <h4>Status</h4>
      <div class="statuswahl" id="dStatus">
        ${status.map((s) => `
          <button class="statuschip" type="button" data-status="${s.id}" aria-pressed="${k.status === s.id}">
            <span class="punkt f-${esc(s.farbe)}"></span>${esc(s.name)}
          </button>`).join('')}
      </div>
    </div>

    <div class="abschnitt">
      <h4>Board</h4>
      <select id="dBoard">
        ${boards.map((b) => `<option value="${b.id}" ${b.id === k.board ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}
      </select>
    </div>

    <div class="abschnitt">
      <h4>Status-Updates</h4>
      <div class="zeile" style="margin-bottom:0.8rem">
        <input type="text" id="dUpdate" placeholder="Was ist passiert?" maxlength="2000" style="flex:1;min-width:160px">
        <button class="btn btn-primary btn-sm" data-tun="update">Eintragen</button>
      </div>
      <div class="verlauf">
        ${[...(k.updates || [])].sort((a, b) => String(b.datum).localeCompare(String(a.datum))).map((u) => `
          <div class="eintrag">
            <div class="oben"><span>${esc(u.datum)}</span>
              <button class="weg" type="button" data-updateweg="${u.id}" aria-label="Update löschen" style="width:24px;height:24px">✕</button></div>
            <p>${esc(u.text)}</p>
          </div>`).join('') || '<p class="tiny" style="margin:0">Noch kein Update.</p>'}
      </div>
    </div>

    <div class="abschnitt">
      <h4>Aufgaben</h4>
      <div class="zeile" style="margin-bottom:0.8rem">
        <input type="text" id="dTodo" placeholder="Was ist zu tun?" maxlength="200" style="flex:1;min-width:140px">
        <input type="date" id="dFrist" style="width:auto">
        <button class="btn btn-primary btn-sm" data-tun="todo">Hinzufügen</button>
      </div>
      <div>
        ${(k.todos || []).map((t) => `
          <div class="aufgabe ${t.erledigt ? 'fertig' : ''}">
            <input type="checkbox" data-todo="${t.id}" ${t.erledigt ? 'checked' : ''} aria-label="erledigt">
            <span class="txt">${esc(t.titel)}</span>
            ${t.faellig ? `<span class="frist ${A.istUeberfaellig(t, HEUTE) ? 'spaet' : ''}">${esc(t.faellig)}</span>` : ''}
            <button class="weg" type="button" data-todoweg="${t.id}" aria-label="Aufgabe entfernen" style="width:28px;height:28px">✕</button>
          </div>`).join('') || '<p class="tiny" style="margin:0">Keine Aufgaben.</p>'}
      </div>
    </div>

    <div class="abschnitt">
      <h4>Angaben</h4>
      <div class="field"><label for="dName">Name</label><input type="text" id="dName" value="${esc(k.name)}" maxlength="120"></div>
      <div class="field"><label for="dFirma">${esc(wort().firma)}</label><input type="text" id="dFirma" value="${esc(k.firma || '')}" maxlength="120"></div>
      <div class="field"><label for="dKontakt">Kontakt</label><input type="text" id="dKontakt" value="${esc(k.kontakt || '')}" maxlength="160" placeholder="Telefon oder E-Mail"></div>
      <div class="field"><label for="dNotiz">Notiz</label><textarea id="dNotiz" rows="4" maxlength="2000">${esc(k.notiz || '')}</textarea></div>
      <div class="zeile">
        <button class="btn btn-primary btn-sm" data-tun="speichern">Angaben speichern</button>
        <button class="btn btn-quiet btn-sm" data-tun="loeschen">Löschen</button>
      </div>
    </div>`;

  box.querySelectorAll('[data-status]').forEach((b) => b.addEventListener('click', () => {
    k.status = b.dataset.status;
    speichern(); zeichneSchub();
  }));
  $('dBoard').addEventListener('change', () => { k.board = $('dBoard').value; speichern(); });

  box.querySelectorAll('[data-todo]').forEach((c) => c.addEventListener('change', () => {
    const t = (k.todos || []).find((x) => x.id === c.dataset.todo);
    if (t) { t.erledigt = c.checked; speichern(); zeichneSchub(); }
  }));
  box.querySelectorAll('[data-todoweg]').forEach((b) => b.addEventListener('click', () => {
    k.todos = (k.todos || []).filter((x) => x.id !== b.dataset.todoweg);
    speichern(); zeichneSchub();
  }));
  box.querySelectorAll('[data-updateweg]').forEach((b) => b.addEventListener('click', () => {
    k.updates = (k.updates || []).filter((x) => x.id !== b.dataset.updateweg);
    speichern(); zeichneSchub();
  }));

  const neuesUpdate = () => {
    const t = $('dUpdate').value.trim();
    if (!t) return;
    k.updates = [...(k.updates || []), { id: kennung(), datum: HEUTE, text: t, status: k.status }];
    speichern(); zeichneSchub();
  };
  const neueAufgabe = () => {
    const t = $('dTodo').value.trim();
    if (!t) return;
    k.todos = [...(k.todos || []), { id: kennung(), titel: t, erledigt: false, faellig: $('dFrist').value || undefined }];
    speichern(); zeichneSchub();
  };
  $('dUpdate').addEventListener('keydown', (e) => { if (e.key === 'Enter') neuesUpdate(); });
  $('dTodo').addEventListener('keydown', (e) => { if (e.key === 'Enter') neueAufgabe(); });

  box.querySelectorAll('[data-tun]').forEach((b) => b.addEventListener('click', () => {
    const was = b.dataset.tun;
    if (was === 'zu') return schliesse();
    if (was === 'update') return neuesUpdate();
    if (was === 'todo') return neueAufgabe();
    if (was === 'speichern') {
      k.name = $('dName').value.trim() || k.name;
      k.firma = $('dFirma').value.trim();
      k.kontakt = $('dKontakt').value.trim();
      k.notiz = $('dNotiz').value.trim();
      speichern(); zeichneSchub();
      flash('Angaben gespeichert.');
      return;
    }
    if (was === 'loeschen') {
      if (!confirm(`„${k.name}“ wirklich löschen? Updates und Aufgaben gehen mit.`)) return;
      daten.kunden = daten.kunden.filter((x) => x.id !== k.id);
      schliesse(); speichern();
      flash('Eintrag gelöscht.');
    }
  }));
}

/* ============================================== Boards und Status ==== */
const zeigeVerwaltung = () => oeffnePanel('verwaltung');

function zeichneVerwaltung() {
  const box = $('schub');
  const status = A.sortiertNachOrdnung(daten.status);
  const boards = A.sortiertNachOrdnung(daten.boards);
  box.innerHTML = `
    <div class="zeile" style="justify-content:space-between;align-items:flex-start">
      <div><h3>Boards und Status</h3>
      <p class="tiny" style="margin:0">Deine eigenen – die Branche war nur die Vorlage.</p></div>
      <button class="btn btn-quiet btn-sm" data-tun="zu">Schliessen</button>
    </div>

    <div class="abschnitt">
      <h4>Boards</h4>
      <div class="verwaltung">
        ${boards.map((b) => `
          <div class="verwaltzeile">
            <input type="text" value="${esc(b.name)}" data-boardname="${b.id}" maxlength="60">
            <span></span>
            <button class="weg" type="button" data-boardweg="${b.id}" aria-label="Board löschen">✕</button>
          </div>`).join('')}
      </div>
      <div class="zeile" style="margin-top:0.7rem">
        <input type="text" id="nBoard" placeholder="Neues Board" maxlength="60" style="flex:1;min-width:150px">
        <button class="btn btn-quiet btn-sm" data-tun="boardplus">Hinzufügen</button>
      </div>
    </div>

    <div class="abschnitt">
      <h4>Status</h4>
      <div class="verwaltung">
        ${status.map((s) => `
          <div class="verwaltzeile">
            <input type="text" value="${esc(s.name)}" data-statusname="${s.id}" maxlength="60">
            <select data-statusfarbe="${s.id}">
              ${A.FARBEN.map((f) => `<option value="${f}" ${f === s.farbe ? 'selected' : ''}>${f}</option>`).join('')}
            </select>
            <button class="weg" type="button" data-statusweg="${s.id}" aria-label="Status löschen">✕</button>
          </div>`).join('')}
      </div>
      <div class="zeile" style="margin-top:0.7rem">
        <input type="text" id="nStatus" placeholder="Neuer Status" maxlength="60" style="flex:1;min-width:150px">
        <select id="nFarbe" style="width:auto">${A.FARBEN.map((f) => `<option value="${f}">${f}</option>`).join('')}</select>
        <button class="btn btn-quiet btn-sm" data-tun="statusplus">Hinzufügen</button>
      </div>
    </div>

    <div class="abschnitt">
      <h4>Branche</h4>
      <p class="tiny" style="margin:0 0 0.7rem">
        Aktuell: ${esc(A.findeBranche(daten.branche).name)}. Ein Wechsel legt neue Boards und
        Status an – deine ${esc(wort().mehrzahl)} bleiben erhalten und landen auf dem ersten Board.
      </p>
      <button class="btn btn-quiet btn-sm" data-tun="branche">Branche wechseln</button>
    </div>`;

  box.querySelectorAll('[data-boardname]').forEach((i) => i.addEventListener('change', () => {
    const b = daten.boards.find((x) => x.id === i.dataset.boardname);
    if (b && i.value.trim()) { b.name = i.value.trim(); speichern(); }
  }));
  box.querySelectorAll('[data-statusname]').forEach((i) => i.addEventListener('change', () => {
    const s = daten.status.find((x) => x.id === i.dataset.statusname);
    if (s && i.value.trim()) { s.name = i.value.trim(); speichern(); }
  }));
  box.querySelectorAll('[data-statusfarbe]').forEach((sel) => sel.addEventListener('change', () => {
    const s = daten.status.find((x) => x.id === sel.dataset.statusfarbe);
    if (s) { s.farbe = sel.value; speichern(); zeichneVerwaltung(); }
  }));

  box.querySelectorAll('[data-boardweg]').forEach((b) => b.addEventListener('click', () => {
    if (daten.boards.length <= 1) return flash('Mindestens ein Board muss bleiben.', 'error');
    const drauf = daten.kunden.filter((k) => k.board === b.dataset.boardweg).length;
    if (drauf && !confirm(`Auf diesem Board liegen ${drauf} Einträge. Sie wandern auf das erste Board. Fortfahren?`)) return;
    daten.boards = daten.boards.filter((x) => x.id !== b.dataset.boardweg);
    const ziel = A.sortiertNachOrdnung(daten.boards)[0]?.id || null;
    daten.kunden.forEach((k) => { if (k.board === b.dataset.boardweg) k.board = ziel; });
    speichern(); zeichneVerwaltung();
  }));
  box.querySelectorAll('[data-statusweg]').forEach((b) => b.addEventListener('click', () => {
    if (daten.status.length <= 1) return flash('Mindestens ein Status muss bleiben.', 'error');
    daten.status = daten.status.filter((x) => x.id !== b.dataset.statusweg);
    const ziel = A.sortiertNachOrdnung(daten.status)[0]?.id || null;
    daten.kunden.forEach((k) => { if (k.status === b.dataset.statusweg) k.status = ziel; });
    speichern(); zeichneVerwaltung();
  }));

  box.querySelectorAll('[data-tun]').forEach((b) => b.addEventListener('click', () => {
    const was = b.dataset.tun;
    if (was === 'zu') return schliesse();
    if (was === 'boardplus') {
      const name = $('nBoard').value.trim();
      if (!name) return;
      daten.boards.push({ id: kennung(), name, ordnung: daten.boards.length });
      speichern(); zeichneVerwaltung();
      return;
    }
    if (was === 'statusplus') {
      const name = $('nStatus').value.trim();
      if (!name) return;
      daten.status.push({ id: kennung(), name, farbe: $('nFarbe').value, ordnung: daten.status.length });
      speichern(); zeichneVerwaltung();
      return;
    }
    if (was === 'branche') {
      if (!confirm('Branche wechseln? Boards und Status werden neu angelegt.')) return;
      const kunden = daten.kunden;
      daten = { ...A.leereArbeit(), kunden };
      schliesse(); zeichne();
    }
  }));
}

/* ---------------------------------------------------------- Steuerung */
$('verwaltenBtn').addEventListener('click', zeigeVerwaltung);
$('suche').addEventListener('input', zeichneSpalten);
$('neuBtn').addEventListener('click', () => {
  const name = prompt(`Name des neuen ${wort().einzahl}n?`.replace('nn?', 'n?'));
  if (!name?.trim()) return;
  const k = {
    id: kennung(), name: name.trim(),
    board: aktivesBoard || A.sortiertNachOrdnung(daten.boards)[0]?.id || null,
    status: A.sortiertNachOrdnung(daten.status)[0]?.id || null,
    updates: [], todos: [], createdAt: new Date().toISOString(),
  };
  daten.kunden.unshift(k);
  speichern();
  oeffneKunde(k.id);
});

/* ------------------------------------------------------------------ Start */
(async () => {
  try {
    const me = await fetch('/api/auth?do=me', { credentials: 'include' }).then((r) => r.json());
    if (!me.user) return void (location.href = '/');
    if (!me.user.modules?.arbeit) {
      document.querySelector('main').innerHTML =
        '<div class="card"><h3>Nicht freigeschaltet</h3><p>Der Arbeitsbereich ist für dein Konto noch nicht offen. Der Host kann ihn freigeben.</p></div>';
      return;
    }
  } catch { /* offline – dann eben ohne Konto */ }

  try {
    const out = await api('/api/data?app=arbeit');
    daten = { ...A.leereArbeit(), ...out.data };
    daten.kunden ||= []; daten.boards ||= []; daten.status ||= [];
  } catch (err) { flash(err.message, 'error'); }

  zeichne();
})();
</script>
</body>
</html>
