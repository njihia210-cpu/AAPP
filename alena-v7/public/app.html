<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alena</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a22">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alena">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="/theme.js"></script>
<style>
  .card.soon { cursor: default; }
  .card.soon:hover { transform: none; }

  /* Ziel des Tages */
  .zitat {
    display: block; margin-bottom: 2rem; padding: 1.6rem 1.8rem;
    border-radius: var(--radius-lg); background: var(--accent-soft);
    border: 1px solid var(--line); border-left: 3px solid var(--akzent-1);
    color: var(--text); text-decoration: none;
  }
  .zitat:hover { border-color: var(--line-strong); border-left-color: var(--akzent-1); color: var(--text); }
  .zitat .oben {
    font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--eyebrow); margin-bottom: 0.7rem;
  }
  .zitat q {
    display: block; font-size: clamp(1.15rem, 2.6vw, 1.5rem); font-weight: 600;
    letter-spacing: -0.02em; line-height: 1.35; quotes: '\201E' '\201C';
  }
  .zitat .unten {
    display: flex; flex-wrap: wrap; gap: 0.9rem; align-items: center;
    margin-top: 1rem; font-size: 0.86rem; color: var(--text-soft);
  }
  .zitat .spur { flex: 1; min-width: 120px; height: 6px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
  .zitat .spur i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/app"><img src="/icons/logo.png" alt="" width="38" height="38"><span>Alena</span></a>
    <div style="display:flex;align-items:center;gap:0.7rem">
      <span class="tiny" id="whoami"></span>
      <a class="btn btn-quiet btn-sm" href="/einstellungen">Einstellungen</a>
      <button class="btn btn-quiet btn-sm" id="logoutBtn">Abmelden</button>
    </div>
  </div>
</header>

<main class="wrap" style="padding-block:2.5rem 3rem">
  <div class="section-head">
    <div class="eyebrow" id="greetLabel">Guten Tag</div>
    <h2 id="greet">Willkommen</h2>
    <p>Deine Apps. Wir schalten sie eine nach der anderen frei.</p>
  </div>

  <div class="msg" id="msg" role="status"></div>

  <!-- Ein Ziel des Tages, wie ein Zitat unter der Begrüssung -->
  <div id="zielKarte" hidden></div>

  <div id="pushBox" class="feature" style="margin-bottom:2rem;grid-template-columns:1fr auto" hidden>
    <div>
      <h3 style="margin:0 0 0.3rem">Erinnerungen einschalten</h3>
      <p class="tiny" id="pushText" style="margin:0">Damit Alena dich an Medikamente, Aufgaben und Lernblöcke erinnern kann. Was genau, stellst du unter Einstellungen ein.</p>
    </div>
    <button class="btn btn-primary" id="pushBtn">Erlauben</button>
  </div>

  <div class="grid" id="modules"></div>
</main>

<footer>
  <div class="wrap">
    <div class="foot-bottom" style="margin-top:0;border-top:none">
      <span>Alena</span>
      <div class="theme-switch" role="group" aria-label="Darstellung">
        <button type="button" data-theme-btn="dark" aria-pressed="true">Dunkel</button>
        <button type="button" data-theme-btn="light" aria-pressed="false">Hell</button>
      </div>
    </div>
  </div>
</footer>

<script src="/ambient.js" defer></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const api = async (url, options = {}) => {
    const res = await fetch(url, {
      headers: { 'content-type': 'application/json' },
      ...options,
      body: options.body ? JSON.stringify(options.body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Fehler');
    return data;
  };
  const flash = (t, kind = 'ok') => {
    const el = $('msg'); el.textContent = t; el.className = `msg ${kind} show`;
    setTimeout(() => el.classList.remove('show'), 6000);
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* Alles rund um Push steht in /push-client.js – hier wird es nur benutzt. */

  $('logoutBtn').addEventListener('click', async () => {
    await api('/api/auth?do=logout', { method: 'POST' }).catch(() => {});
    location.href = '/';
  });

  async function setupPush(vapidKey) {
    const box = $('pushBox');
    let push;
    try { push = await import('/push-client.js'); } catch { return; }

    if (!vapidKey) return;   // ohne Serverschlüssel gibt es nichts zu erlauben

    /* Erlaubnis steht schon: still prüfen, ob das Abo noch gültig ist.
       Genau hier fällt auf, wenn der Server die Schlüssel gewechselt hat. */
    if (push.kannPush() && Notification.permission === 'granted') {
      const stand = await push.auffrischen(vapidKey);
      if (stand.stand === 'fehler') {
        box.hidden = false;
        $('pushText').textContent =
          `Die Mitteilungen sind unterbrochen: ${stand.fehler} Einmal neu erlauben bringt sie zurück.`;
        $('pushBtn').textContent = 'Neu erlauben';
      } else {
        return;
      }
    }

    const problem = push.geraeteProblem();
    if (problem) {
      // Auf dem iPhone ist das kein Fehler, sondern der nötige nächste Schritt.
      if (push.istIOS && !push.istInstalliert) {
        box.hidden = false;
        $('pushText').textContent = problem;
        $('pushBtn').hidden = true;
      }
      return;
    }

    box.hidden = false;
    $('pushBtn').addEventListener('click', async () => {
      try {
        await push.anmelden(vapidKey);
        box.hidden = true;
        flash('Erinnerungen sind aktiv.');
      } catch (err) {
        flash(err.message, 'error');
      }
    });
  }

  /* Ein offenes Ziel unter die Begrüssung stellen – der Tag über dasselbe. */
  async function zeigeZiel(me) {
    if (!me.user.modules?.ziele) return;
    let kern, daten;
    try {
      [kern, daten] = await Promise.all([
        import('/ziele-core.js'),
        api('/api/data?app=ziele'),
      ]);
    } catch { return; }

    const ziel = kern.zielDesTages(daten.data);
    if (!ziel) return;

    const f = kern.fortschritt(ziel);
    const box = $('zielKarte');
    box.hidden = false;
    box.innerHTML = `
      <a class="zitat" href="/ziele">
        <div class="oben">Dein Ziel</div>
        <q>${esc(ziel.titel)}</q>
        <div class="unten">
          <span>${esc(kern.standText(ziel))}</span>
          <span class="spur"><i style="width:${Math.round(f.anteil * 100)}%"></i></span>
        </div>
      </a>`;
  }

  (async () => {
    if ('serviceWorker' in navigator) {
      try { await navigator.serviceWorker.register('/sw.js'); } catch {}
    }
    let me;
    try { me = await api('/api/auth?do=me'); } catch { me = { user: null }; }
    if (!me.user) return void (location.href = '/');

    $('whoami').textContent = me.user.name || me.user.username;
    $('greet').textContent = `Hallo ${(me.user.name || me.user.username).split(' ')[0]}`;
    const h = new Date().getHours();
    $('greetLabel').textContent = h < 11 ? 'Guten Morgen' : h < 18 ? 'Guten Tag' : 'Guten Abend';

    const grid = $('modules');
    const enabled = me.modules.filter((m) => me.user.modules?.[m.id]);
    if (!enabled.length) {
      grid.innerHTML = '<div class="card"><h3>Noch nichts freigeschaltet</h3><p>Der Host muss deine Apps noch aktivieren.</p></div>';
    }
    for (const m of enabled) {
      const live = m.status === 'live' && m.href;
      const el = document.createElement(live ? 'a' : 'article');
      el.className = live ? 'card' : 'card soon';
      if (live) el.href = m.href;
      el.innerHTML = `<div class="icon">${esc(m.icon)}</div><h3>${esc(m.name)}</h3>
        <p>${esc(m.desc)}</p>
        <span class="badge">${live ? 'Öffnen →' : 'Kommt bald'}</span>`;
      grid.appendChild(el);
    }

    zeigeZiel(me);
    setupPush(me.vapidPublicKey);
  })();
})();
</script>
</body>
</html>
